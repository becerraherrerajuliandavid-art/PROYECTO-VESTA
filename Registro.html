<body>
    <main class="form-registro">
        <section class="card form-registro">
            <h1>Regístrate</h1>

            <form id="formRegistro">
                <div class="campo">
                    <label for="name">Nombres:</label>
                    <input type="text" name="name" id="name" placeholder="Nombre" required>
                </div>

                <div class="campo">
                    <label for="lastname">Apellidos:</label>
                    <input type="text" name="lastname" id="lastname" placeholder="Apellidos" required>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" name="email" id="email" placeholder="Correo electrónico" required>
                </div>

                <div class="campo">
                    <label for="document">Documento de identidad:</label>
                    <input type="text" name="document" id="document" placeholder="Documento de identidad" required>
                </div>

                <div class="campo">
                    <label for="position">Cargo:</label>
                    <input type="text" name="position" id="position" placeholder="Cargo" required>
                </div>

                <button type="submit" id="btnRegistrar">Registrar</button>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("formRegistro").addEventListener("submit", function (e) {
            e.preventDefault();   // evita que la página se recargue
            registrarUsuario();   // solo se ejecuta si todos los required están completos
        });
    </script>
</body>
